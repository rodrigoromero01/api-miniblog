# Blueprint de Render: crea la API y la base de datos PostgreSQL juntas.
# En Render: New > Blueprint > elegir este repositorio.

services:
  - type: web
    name: api-miniblog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Render conecta la API con la base usando la URL interna
      - key: DATABASE_URL
        fromDatabase:
          name: miniblog-db
          property: connectionString

databases:
  - name: miniblog-db
    plan: free
    databaseName: miniblog
    user: miniblog
